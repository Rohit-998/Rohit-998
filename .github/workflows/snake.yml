name: Generate Snake Animation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Rohit-998
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=orange&hide_progress_bar=true
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange&hide_progress_bar=true

      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
